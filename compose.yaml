services:
  local-llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - -hf
      - ggml-org/Qwen3-4B-GGUF:Q4_K_M
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "2048"
      - --parallel
      - "1"
    volumes:
      - model-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 2s
      retries: 60
      start_period: 5s

  resource-manager:
    profiles: [tools]
    build: .
    environment:
      AI_CLUSTER_COMMAND: ${AI_CLUSTER_COMMAND:-recover}
      AI_CLUSTER_LOCAL_ENDPOINT: http://local-llama:8080/v1/chat/completions
      AI_CLUSTER_SOURCES: local
    volumes:
      - resource-data:/data
    depends_on:
      local-llama:
        condition: service_healthy

  resource-service:
    build: .
    command: ["node", "dist/src/server.js"]
    environment:
      AI_CLUSTER_HOST: 0.0.0.0
      AI_CLUSTER_LOCAL_ENDPOINT: http://local-llama:8080/v1/chat/completions
      AI_CLUSTER_SOURCES: openrouter,groq,local
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - resource-data:/data
      - ./secrets/openrouter_api_key:/run/secrets/openrouter_api_key:ro
      - ./secrets/groq_api_key:/run/secrets/groq_api_key:ro
    depends_on:
      local-llama:
        condition: service_healthy

volumes:
  model-cache:
    name: ai-cluster-model-cache
  resource-data:
    name: ai-cluster-resource-data
